name: xdu-event
x-server: &server
  build:
    context: .
    dockerfile: images/server/Dockerfile
  image: xdu-race-runtime:local
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /data
  entrypoint: [java]
  networks: [backend]
  stop_grace_period: 60s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: "no"
x-race: &race
  <<: *server
  command: [-Xms256M, "-Xmx${RACE_HEAP:-1024M}", -Dauthlibinjector.noLogFile, -Dauthlibinjector.mojangNamespace=disabled, -Dauthlibinjector.usernameCheck=enabled, "-javaagent:/authlib-injector.jar=https://skin.mualliance.ltd/api/yggdrasil", -jar, /server.jar, --nogui]
  healthcheck:
    test: [CMD, python3, -m, raceops.health]
    start_period: 60s
    interval: 20s
    timeout: 10s
    retries: 5
services:
  race-a:
    <<: *race
    volumes:
      - ./volumes/event/race-a:/data
      - ./downloads/mojang_26.3.jar:/server.jar:ro
      - ./downloads/authlib-injector-1.2.8.jar:/authlib-injector.jar:ro
      - ./volumes/event/secrets/race-a:/run/secrets/rcon:ro
  race-b:
    <<: *race
    volumes:
      - ./volumes/event/race-b:/data
      - ./downloads/mojang_26.3.jar:/server.jar:ro
      - ./downloads/authlib-injector-1.2.8.jar:/authlib-injector.jar:ro
      - ./volumes/event/secrets/race-b:/run/secrets/rcon:ro
  race-c:
    <<: *race
    volumes:
      - ./volumes/event/race-c:/data
      - ./downloads/mojang_26.3.jar:/server.jar:ro
      - ./downloads/authlib-injector-1.2.8.jar:/authlib-injector.jar:ro
      - ./volumes/event/secrets/race-c:/run/secrets/rcon:ro
  lobby:
    <<: *server
    command: [-Xms128M, "-Xmx${LOBBY_HEAP:-512M}", -Dauthlibinjector.noLogFile, -Dauthlibinjector.mojangNamespace=disabled, -Dauthlibinjector.usernameCheck=enabled, "-javaagent:/authlib-injector.jar=https://skin.mualliance.ltd/api/yggdrasil", -jar, /server.jar, --nogui]
    volumes:
      - ./volumes/event/lobby:/data
      - ./downloads/mojang_26.3.jar:/server.jar:ro
      - ./downloads/authlib-injector-1.2.8.jar:/authlib-injector.jar:ro
      - ./volumes/event/secrets/lobby:/run/secrets/rcon:ro
    healthcheck:
      test: [CMD, python3, -m, raceops.health, --lobby]
      start_period: 60s
      interval: 20s
      timeout: 10s
      retries: 5
  resource-pack:
    <<: *server
    entrypoint: [python3, -m, raceops.pack_server]
    command: [--file, /pack.zip, --lock, /versions.lock.json]
    ports: ["${EVENT_BIND:-127.0.0.1}:25566:25566"]
    volumes:
      - ./downloads/resources-1.6.14.zip:/pack.zip:ro
      - ./config/versions.lock.json:/versions.lock.json:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:25566/pack.zip', method='HEAD'), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
  proxy:
    <<: *server
    command: [-Xms128M, "-Xmx${PROXY_HEAP:-256M}", -Dauthlibinjector.noLogFile, -Dauthlibinjector.mojangNamespace=disabled, -Dauthlibinjector.usernameCheck=enabled, "-javaagent:/authlib-injector.jar=https://skin.mualliance.ltd/api/yggdrasil", -jar, /server.jar]
    stdin_open: true
    ports: ["${EVENT_BIND:-127.0.0.1}:25565:25565"]
    volumes:
      - ./volumes/event/proxy:/data
      - ./downloads/BungeeCord-2096.jar:/server.jar:ro
      - ./downloads/authlib-injector-1.2.8.jar:/authlib-injector.jar:ro
    depends_on:
      race-a: {condition: service_healthy}
      race-b: {condition: service_healthy}
      race-c: {condition: service_healthy}
      lobby: {condition: service_healthy}
      resource-pack: {condition: service_healthy}
networks:
  backend: {}
